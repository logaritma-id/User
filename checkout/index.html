<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logaritma Premium Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Space Grotesk"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        iframe { flex: 1; width: 100%; border: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white w-full">
    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 w-full overflow-x-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-center">
            <a href="/" class="flex items-center gap-2 group">
                <span class="font-heading text-xl font-black tracking-tight text-white group-hover:text-blue-400 transition">
                    LOGARITMA<span class="text-blue-500">.ID</span>
                </span>
            </a>
        </div>
    </header>

    <iframe id="mayar-iframe" src="" allowfullscreen></iframe>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-500 py-4 border-t border-slate-900 text-center text-xs font-medium z-10 shrink-0">
        <p>&copy; 2026 Metoda Logaritma by Tony Herman Abrar. All rights reserved.</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        const iframe = document.getElementById('mayar-iframe');
        
        if (type === 'new') {
            iframe.src = 'https://baimwarunkarsi.myr.id/m/logaritma-umkm-pro-akses-ai-profit-engine';
        } else if (type === 'renew') {
            iframe.src = 'https://baimwarunkarsi.myr.id/pay-membership';
        } else {
            window.location.href = '/';
        }
    </script>
</body>
</html>
