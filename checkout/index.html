<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logaritma Premium Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Space Grotesk"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; background-color: #020617; }
        iframe { flex: 1; width: 100%; border: none; background: white; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white w-full">
    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-slate-950 border-b border-slate-800 w-full overflow-x-hidden shadow-lg shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 group">
                <span class="font-heading text-xl font-black tracking-tight text-white group-hover:text-blue-400 transition hidden sm:block">
                    LOGARITMA<span class="text-blue-500">.ID</span>
                </span>
            </a>
            <div class="flex items-center gap-3">
                <button id="btn-konfirmasi" class="hidden bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white text-xs font-bold py-1.5 px-4 rounded-full shadow-lg shadow-emerald-500/25 transition-all animate-bounce">
                    ✅ Selesai Membayar?
                </button>
                <div class="text-xs font-medium bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700 hidden sm:block">
                    Secure Checkout 🔒
                </div>
            </div>
        </div>
    </header>

    <!-- Embedded Mayar Form -->
    <iframe id="mayar-iframe" src="" allowfullscreen></iframe>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/js/db.js?v=7"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        const iframe = document.getElementById('mayar-iframe');
        
        if (type === 'new') {
            iframe.src = 'https://baimwarunkarsi.myr.id/m/logaritma-umkm-pro-akses-ai-profit-engine';
        } else if (type === 'renew') {
            iframe.src = 'https://baimwarunkarsi.myr.id/pay-membership';
        } else {
            window.location.href = '/';
        }

        // Tampilkan tombol konfirmasi HANYA setelah 45 detik (estimasi waktu user selesai bayar)
        // Ini mencegah user asal klik sebelum benar-benar membayar.
        setTimeout(() => {
            const btn = document.getElementById('btn-konfirmasi');
            if(btn) {
                btn.classList.remove('hidden');
            }
        }, 45000);

        document.getElementById('btn-konfirmasi').addEventListener('click', async () => {
            const userStr = localStorage.getItem('logarithm_current_user');
            if(!userStr) {
                window.location.href = '/login/';
                return;
            }

            const confirm = await Swal.fire({
                title: 'Konfirmasi',
                text: 'Apakah Anda sudah melihat layar "Transaction Success" pada form di bawah?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Ya, Sudah!',
                cancelButtonText: 'Belum',
                background: '#0f172a',
                color: '#cbd5e1',
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#ef4444'
            });

            if(confirm.isConfirmed) {
                const user = JSON.parse(userStr);
                
                // Force upgrade locally
                user.status = "PRO";
                localStorage.setItem('logarithm_current_user', JSON.stringify(user));
                localStorage.setItem('show_premium_popup', 'true');

                // Sync to Firebase
                if(window.LogaritmaDB && window.LogaritmaDB.updateLeadStatus) {
                    try {
                        Swal.fire({title: 'Memverifikasi...', allowOutsideClick: false, background: '#0f172a', color: '#cbd5e1'});
                        Swal.showLoading();
                        
                        await Promise.race([
                            window.LogaritmaDB.updateLeadStatus(user.whatsapp || user.wa, "PRO"),
                            new Promise(r => setTimeout(r, 2000))
                        ]);
                    } catch(e) { console.error(e); }
                }

                // Redirect back to dashboard
                let catId = user.categoryId;
                if(!catId) {
                    const k = user.kategori || '';
                    if(k.includes('Kuliner') || k.includes('F&B')) catId = 'kuliner';
                    else if(k.includes('Fashion') || k.includes('Retail') || k.includes('Olshop')) catId = 'fashion';
                    else if(k.includes('Percetakan') || k.includes('Sablon')) catId = 'percetakan';
                    else if(k.includes('Kaki Lima') || k.includes('Gerobak')) catId = 'pkl';
                    else if(k.includes('Agen') || k.includes('Distributor') || k.includes('Grosir')) catId = 'distributor';
                    else catId = 'kuliner';
                }
                
                window.top.location.href = '/tools/' + catId + '/#dasbor';
            }
        });

    </script>
</body>
</html>
