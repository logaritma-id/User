<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logaritma Premium Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Space Grotesk"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; background-color: #020617; }
        iframe { flex: 1; width: 100%; border: none; background: white; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white w-full">
    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-slate-950 border-b border-slate-800 w-full overflow-x-hidden shadow-lg shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 group">
                <span class="font-heading text-xl font-black tracking-tight text-white group-hover:text-blue-400 transition hidden sm:block">
                    LOGARITMA<span class="text-blue-500">.ID</span>
                </span>
            </a>
            <div class="flex items-center gap-3">
                <div class="text-xs font-medium text-amber-400 bg-amber-500/10 px-3 py-1.5 rounded-full border border-amber-500/30 animate-pulse">
                    ⚠️ Pastikan klik "Kembali ke Website" setelah pembayaran sukses
                </div>
                <div class="text-xs font-medium bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700 hidden sm:block">
                    Secure Checkout 🔒
                </div>
            </div>
        </div>
    </header>

    <!-- Embedded Mayar Form -->
    <iframe id="mayar-iframe" src="" allowfullscreen></iframe>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/js/db.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        const iframe = document.getElementById('mayar-iframe');
        
        if (type === 'new') {
            iframe.src = 'https://baimwarunkarsi.myr.id/m/logaritma-umkm-pro-akses-ai-profit-engine';
        } else if (type === 'renew') {
            iframe.src = 'https://baimwarunkarsi.myr.id/pay-membership';
        } else {
            window.location.href = '/';
        }

    </script>
</body>
</html>
