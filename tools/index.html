<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Kategori - Logaritma Tools</title>
    
    <meta name="description" content="Pilih industri usaha Anda dan masuk ke sistem rekayasa operasional Logaritma.">
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Space Grotesk"', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#141e33',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-950 text-slate-300 font-sans antialiased min-h-screen flex flex-col selection:bg-emerald-500/30 selection:text-emerald-200">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="text-white font-heading font-bold text-xl tracking-tight flex items-center gap-2 hover:opacity-80 transition">
                <span class="w-8 h-8 rounded bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-sm shadow-lg shadow-emerald-500/20">∑</span>
                Logaritma<span class="text-emerald-400">Tools</span>
            </a>
            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300">
                    <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                    STATUS: FREE PLAN
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="text-center mb-12 animate-fade-in-up">
            <div class="inline-flex w-16 h-16 rounded-full bg-emerald-500/10 items-center justify-center text-emerald-400 text-3xl mb-4 border border-emerald-500/30 shadow-[0_0_30px_rgba(16,185,129,0.15)]">
                ⚙️
            </div>
            <h1 class="text-4xl font-bold text-white font-heading tracking-tight mb-4">Pusat Kategori Industri</h1>
            <p class="text-slate-400 max-w-2xl mx-auto">Sistem rekayasa operasional Logaritma disesuaikan secara khusus untuk masing-masing bidang usaha. Silakan pilih industri Anda di bawah ini untuk masuk ke Dashboard Workspace.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="category-grid">
            <!-- Diisi dari JS -->
        </div>
    </main>

    <script src="/js/category-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('category-grid');
            Object.values(CATEGORY_CONFIG).forEach(cat => {
                const card = document.createElement('a');
                card.href = '/tools/' + cat.id + '/';
                card.className = 'group bg-slate-900 border border-slate-800 rounded-2xl p-6 hover:border-emerald-500/50 hover:bg-slate-800/80 transition-all cursor-pointer relative overflow-hidden animate-fade-in-up shadow-xl';
                card.innerHTML = `
                    <div class="absolute -right-10 -top-10 w-32 h-32 bg-emerald-500/5 rounded-full blur-2xl group-hover:bg-emerald-500/10 transition"></div>
                    <div class="w-12 h-12 bg-slate-800 rounded-xl border border-slate-700 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 group-hover:border-emerald-500/30 group-hover:text-emerald-400 transition-all shadow-lg">
                        ${cat.icon}
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2 font-heading group-hover:text-emerald-400 transition-colors">${cat.name}</h3>
                    <p class="text-sm text-slate-400">${cat.description}</p>
                    <div class="mt-6 flex items-center gap-2 text-xs font-bold text-emerald-500 group-hover:translate-x-1 transition-transform">
                        Masuk ke Workspace <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
